---
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    # The deploy role can only be assumed from this environment.
    # Add yourself as a required reviewer on it to get an approval step.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false

      - name: Get short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        working-directory: terraform
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Apply
        working-directory: terraform
        run: terraform apply -auto-approve
