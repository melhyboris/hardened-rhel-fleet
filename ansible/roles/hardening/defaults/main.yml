---
# Reboot each server at the end of the run (kernel settings, immutable audit rules).
hardening_reboot: true

# System-wide crypto policy. DEFAULT already rejects SHA-1 signatures and TLS below 1.2 on RHEL 9.
hardening_crypto_policy: DEFAULT

# firewalld zone applied to every interface. "drop" discards anything not explicitly allowed.
hardening_firewall_zone: drop
hardening_firewall_services:
  - ssh

# Turn on account lockout and password history through authselect.
hardening_manage_authselect: true

hardening_sshd_settings:
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  PermitEmptyPasswords: "no"
  HostbasedAuthentication: "no"
  IgnoreRhosts: "yes"
  PermitUserEnvironment: "no"
  X11Forwarding: "no"
  AllowTcpForwarding: "no"
  AllowAgentForwarding: "no"
  MaxAuthTries: "4"
  MaxSessions: "10"
  MaxStartups: "10:30:60"
  LoginGraceTime: "60"
  ClientAliveInterval: "300"
  ClientAliveCountMax: "3"
  LogLevel: VERBOSE
  Banner: /etc/issue.net

hardening_sysctl:
  net.ipv4.ip_forward: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.accept_ra: 0
  net.ipv6.conf.default.accept_ra: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0
  kernel.randomize_va_space: 2
  kernel.kptr_restrict: 1
  kernel.dmesg_restrict: 1
  kernel.yama.ptrace_scope: 1
  fs.suid_dumpable: 0

# Kernel modules a server has no use for.
hardening_blocked_modules:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - squashfs
  - udf
  - usb-storage
  - dccp
  - sctp
  - rds
  - tipc

# Services stopped and masked when they are installed.
hardening_unneeded_services:
  - rpcbind.service
  - rpcbind.socket
  - avahi-daemon.service
  - cups.service
  - nfs-server.service
  - bluetooth.service

hardening_password_max_days: 365
hardening_password_min_days: 1
hardening_password_warn_age: 7
hardening_password_min_length: 14
hardening_faillock_deny: 5
hardening_faillock_unlock_time: 900
hardening_password_history: 24
hardening_shell_timeout: 900
